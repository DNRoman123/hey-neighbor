workflows:
  ios-appstore:
    name: Hey Neighbor iOS - App Store
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: HeyNeighborASC
    environment:
      ios_signing:
        # Uses the code signing identities already uploaded to Codemagic
        # (Team settings > Code signing identities), so no profile has to be
        # created during the build.
        certificates:
          - Hey Neighbor Distribution
        provisioning_profiles:
          - Hey Neighborbor ios_app_store 1785694858
      vars:
        BUNDLE_ID: "app.lovable.heyneigh"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        EXPORT_OPTIONS_PLIST: "/Users/builder/export_options.plist"
        APP_STORE_APPLE_ID: 19533586859
      node: 22
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install dependencies
        script: npm install --no-audit --no-fund
      - name: Build web bundle
        script: npm run build
      - name: Sync Capacitor iOS project
        script: npx cap sync ios
      - name: Configure native Google Sign-In
        # Google client ids are public identifiers, so the value is read from
        # the deployed config endpoint when no CI variable is present. This step
        # never fails the build: Google login simply stays disabled if unset.
        script: |
          CLIENT_ID="${GOOGLE_IOS_CLIENT_ID:-}"
          if [ -z "$CLIENT_ID" ]; then
            CLIENT_ID="$(curl -fsS https://hey-neighbor-io.lovable.app/api/public/google-config \
              | sed -n 's/.*"iosClientId":"\([^"]*\)".*/\1/p' || true)"
          fi
          case "$CLIENT_ID" in
            *.apps.googleusercontent.com)
              PLIST="ios/App/App/Info.plist"
              REVERSED="com.googleusercontent.apps.$(echo "$CLIENT_ID" | awk -F'.apps.googleusercontent.com' '{print $1}')"
              /usr/libexec/PlistBuddy -c "Delete :GIDClientID" "$PLIST" 2>/dev/null || true
              /usr/libexec/PlistBuddy -c "Add :GIDClientID string $CLIENT_ID" "$PLIST"
              /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$PLIST" 2>/dev/null || true
              /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST"
              /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
              /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
              /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string $REVERSED" "$PLIST"
              echo "Configured native Google Sign-In URL scheme."
              ;;
            *)
              echo "No iOS Google client id resolved - skipping Google Sign-In configuration."
              ;;
          esac
      - name: Install CocoaPods (if the project uses them)
        script: |
          if [ -f ios/App/Podfile ]; then
            cd ios/App && pod install
          fi
      - name: Set build number
        script: |
          cd ios/App
          agvtool new-version -all "$(date -u +%y%m%d%H%M)"
      - name: Set up signing
        script: |
          set -e
          xcode-project use-profiles \
            --project "$XCODE_PROJECT" \
            --archive-method app-store \
            --export-options-plist "$EXPORT_OPTIONS_PLIST" \
            --code-signing-setup-verbose-logging
      - name: Build .ipa
        script: |
          set -e
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config Release \
            --export-options-plist "$EXPORT_OPTIONS_PLIST"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
      email:
        recipients:
          - davidnroman@hotmail.com
        notify:
          success: true
          failure: true
