workflows:
  ios-appstore:
    name: Hey Neighbor iOS - App Store
    instance_type: mac_mini_m2
    max_build_duration: 60
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    integrations:
      app_store_connect: HeyNeighborASC
    environment:
      vars:
        BUNDLE_ID: "app.lovable.heyneigh"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        EXPORT_OPTIONS_PLIST: "/Users/builder/export_options.plist"
        APP_STORE_APPLE_ID: 19533586859
        MARKETING_VERSION: "1.1"
      node: 22
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install dependencies
        script: npm install --no-audit --no-fund
      - name: Build web bundle
        script: npm run build
      - name: Sync Capacitor iOS project
        script: npx cap sync ios
      - name: Install CocoaPods (if the project uses them)
        script: |
          if [ -f ios/App/Podfile ]; then
            cd ios/App && pod install
          fi
      - name: Set version and build number
        script: |
          cd ios/App
          agvtool new-marketing-version "$MARKETING_VERSION"
          agvtool new-version -all "$(date -u +%y%m%d%H%M)"
      - name: Set up signing (fetch or create App Store profile)
        script: |
          set -e
          keychain initialize

          # Make sure the bundle identifier exists on App Store Connect.
          app-store-connect bundle-ids register "$BUNDLE_ID" \
            --name "Hey Neighbor" --platform IOS 2>/dev/null || true

          # Fetch signing files; create the profile (and certificate) when missing.
          # Retry without --create in case a distribution certificate already exists.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --platform IOS \
            --create \
          || app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --platform IOS

          keychain add-certificates

          xcode-project use-profiles \
            --project "$XCODE_PROJECT" \
            --archive-method app-store \
            --export-options-plist "$EXPORT_OPTIONS_PLIST" \
            --code-signing-setup-verbose-logging
      - name: Build .ipa
        script: |
          set -e
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config Release \
            --export-options-plist "$EXPORT_OPTIONS_PLIST"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: true
        cancel_previous_submissions: true
        release_type: AFTER_APPROVAL
        copyright: "2026 David Roman"
      email:
        recipients:
          - davidnroman@hotmail.com
        notify:
          success: true
          failure: true
