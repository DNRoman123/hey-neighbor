workflows:
  ios-appstore:
    name: Hey Neighbor iOS - App Store
    # Cloud macOS machine with the latest Xcode. No local Mac needed.
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: HeyNeighborASC
    environment:
      # No environment-variable groups are required: the iOS Google client ID is
      # read from the deployed public config endpoint during the build. (A
      # reference to a group that does not exist aborts the build before it starts.)
      # Codemagic downloads the already-stored distribution certificate (with
      # its matching private key) and provisioning profile. Never create a new
      # Apple certificate on each build.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.lovable.heyneigh
      vars:
        BUNDLE_ID: "app.lovable.heyneigh"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        EXPORT_OPTIONS_PLIST: "/Users/builder/export_options.plist"
        APP_STORE_APPLE_ID: 19533586859
      node: 22
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install dependencies
        script: npm ci || npm install
      - name: Build web bundle
        script: npm run build
      - name: Sync Capacitor iOS project
        script: npx cap sync ios
      - name: Configure native Google Sign-In
        # Uses GOOGLE_IOS_CLIENT_ID from the Codemagic env group when present,
        # otherwise reads it from the deployed app (Google client ids are public
        # identifiers), so no CI variable has to be maintained by hand.
        script: |
          set -euo pipefail
          CLIENT_ID="${GOOGLE_IOS_CLIENT_ID:-}"
          if [ -z "$CLIENT_ID" ]; then
            echo "GOOGLE_IOS_CLIENT_ID not set - fetching it from the deployed app"
            CLIENT_ID="$(curl -fsS https://hey-neighbor-io.lovable.app/api/public/google-config \
              | sed -n 's/.*"iosClientId":"\([^"]*\)".*/\1/p' || true)"
          fi
          case "$CLIENT_ID" in
            *.apps.googleusercontent.com) ;;
            *)
              echo "Could not resolve a valid iOS Google client id. Add GOOGLE_IOS_CLIENT_ID to the 'appstore' environment-variable group in Codemagic (value ends in .apps.googleusercontent.com)."
              exit 1
              ;;
          esac
          PLIST="ios/App/App/Info.plist"
          REVERSED="$(echo "$CLIENT_ID" | awk -F'.apps.googleusercontent.com' '{print $1}')"
          REVERSED="com.googleusercontent.apps.$REVERSED"
          /usr/libexec/PlistBuddy -c "Delete :GIDClientID" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :GIDClientID string $CLIENT_ID" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string $REVERSED" "$PLIST"
          echo "Configured native Google Sign-In URL scheme."
      - name: Install CocoaPods (if the project uses them)
        script: |
          if [ -f ios/App/Podfile ]; then
            cd ios/App && pod install
          fi
      - name: Set build number
        script: |
          cd ios/App
          # A monotonically increasing UTC timestamp avoids an unnecessary API
          # request before signing credentials have been validated.
          agvtool new-version -all "$(date -u +%y%m%d%H%M)"
      - name: Set up signing
        script: |
          set -euo pipefail
          xcode-project use-profiles \
            --project "$XCODE_PROJECT" \
            --archive-method app-store \
            --export-options-plist "$EXPORT_OPTIONS_PLIST" \
            --code-signing-setup-verbose-logging
      - name: Build .ipa
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config Release \
            --export-options-plist "$EXPORT_OPTIONS_PLIST"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Apple allows only one build per train in beta review at a time, so
        # auto-submission is off: the build still lands in TestFlight and can be
        # submitted manually from App Store Connect when the previous one clears.
        submit_to_testflight: false
        submit_to_app_store: false

      email:
        recipients:
          - davidnroman@hotmail.com
        notify:
          success: true
          failure: true
